<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanIt AI Assistant</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.jpg" type="image/jpeg"/>
<style>
  .chat-layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 100vh;
    overflow: hidden;
  }
  .chat-sidebar {
    background: var(--navy);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow-y: auto;
  }
  .chat-sidebar-brand {
    display: flex; align-items: center; gap: 0.75rem;
    padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1);
    text-decoration: none;
  }
  .chat-sidebar-brand img { height: 44px; border-radius: 10px; }
  .chat-sidebar-title { color: white; font-weight: 800; font-size: 1rem; }
  .chat-sidebar-sub { color: rgba(255,255,255,0.5); font-size: 0.7rem; }

  .quick-topic {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 0.85rem 1rem;
    cursor: pointer; transition: all 0.2s;
    color: rgba(255,255,255,0.8);
    font-size: 0.82rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    text-align: left; width: 100%;
  }
  .quick-topic:hover { background: rgba(26,86,219,0.4); border-color: rgba(26,86,219,0.5); color: white; }
  .quick-topic-label { font-size: 0.68rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; }

  .sidebar-back {
    display: flex; align-items: center; gap: 0.5rem;
    color: rgba(255,255,255,0.5); font-size: 0.82rem;
    text-decoration: none; padding: 0.5rem;
    border-radius: 8px; transition: 0.2s; margin-top: auto;
  }
  .sidebar-back:hover { color: white; background: rgba(255,255,255,0.08); }

  /* MAIN CHAT AREA */
  .chat-main { display: flex; flex-direction: column; background: var(--bg); }
  .chat-header {
    padding: 1.25rem 1.5rem;
    background: white; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .chat-header-info { display: flex; align-items: center; gap: 0.75rem; }
  .bot-avatar {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem; box-shadow: 0 4px 12px rgba(26,86,219,0.3);
  }
  .bot-name { font-weight: 700; font-size: 0.95rem; }
  .bot-status { font-size: 0.72rem; color: var(--green); display: flex; align-items: center; gap: 0.3rem; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .messages-area {
    flex: 1; overflow-y: auto; padding: 1.5rem;
    display: flex; flex-direction: column; gap: 1.25rem;
    scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 0.75rem; max-width: 75%; animation: msgIn 0.3s ease; }
  @keyframes msgIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: none; } }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg-avatar {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }
  .msg.bot .msg-avatar { background: linear-gradient(135deg, var(--blue), var(--cyan)); }
  .msg.user .msg-avatar { background: var(--navy); }
  .msg-bubble {
    padding: 0.85rem 1.1rem; border-radius: 16px;
    font-size: 0.88rem; line-height: 1.6;
  }
  .msg.bot .msg-bubble {
    background: white; border: 1px solid var(--border);
    border-top-left-radius: 4px; box-shadow: var(--shadow);
    color: var(--text);
  }
  .msg.user .msg-bubble {
    background: linear-gradient(135deg, var(--blue), var(--blue-light));
    color: white; border-bottom-right-radius: 4px;
  }
  .msg-time { font-size: 0.68rem; color: var(--text3); margin-top: 0.3rem; }
  .msg.user .msg-time { text-align: right; }

  .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 0.5rem 0; }
  .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); animation: typing 1.4s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

  /* INPUT AREA */
  .chat-input-area {
    padding: 1rem 1.5rem;
    background: white; border-top: 1px solid var(--border);
  }
  .input-suggestions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .suggestion-chip {
    padding: 0.3rem 0.75rem; border-radius: 99px;
    background: var(--blue-pale); color: var(--blue);
    font-size: 0.75rem; font-weight: 600; cursor: pointer;
    border: 1px solid rgba(26,86,219,0.2); transition: all 0.2s;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .suggestion-chip:hover { background: var(--blue); color: white; }
  .input-row { display: flex; gap: 0.75rem; }
  .chat-input {
    flex: 1; padding: 0.85rem 1.1rem;
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 12px; color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.9rem; outline: none; transition: all 0.2s;
  }
  .chat-input:focus { border-color: var(--blue); background: white; box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), var(--blue-light));
    border: none; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    font-size: 1.1rem; transition: all 0.2s;
    box-shadow: 0 4px 12px rgba(26,86,219,0.35);
  }
  .send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(26,86,219,0.45); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .disclaimer { font-size: 0.7rem; color: var(--text3); text-align: center; margin-top: 0.5rem; }

  @media (max-width: 768px) {
    .chat-layout { grid-template-columns: 1fr; }
    .chat-sidebar { display: none; }
    .msg { max-width: 90%; }
  }

  /* Rich message content */
  .msg-bubble ul { margin: 0.5rem 0 0 1rem; }
  .msg-bubble li { margin-bottom: 0.25rem; }
  .msg-bubble strong { color: var(--blue); }
  .msg.user .msg-bubble strong { color: rgba(255,255,255,0.9); }
  .msg-bubble .rate-table { margin-top: 0.75rem; border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  .msg-bubble .rate-table th { background: var(--blue-pale); color: var(--blue); padding: 0.4rem 0.6rem; text-align: left; }
  .msg-bubble .rate-table td { padding: 0.4rem 0.6rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<div class="chat-layout">
  <!-- SIDEBAR -->
  <aside class="chat-sidebar">
    <a href="index.html" class="chat-sidebar-brand">
      <img src="logo.jpg" alt="LoanIt"/>
      <div>
        <div class="chat-sidebar-title">LoanIt AI</div>
        <div class="chat-sidebar-sub">Loan Assistant</div>
      </div>
    </a>

    <div class="quick-topic-label">Quick Topics</div>

    <button class="quick-topic" onclick="askTopic('What documents do I need for an education loan?')">
      📄 Documents Required
    </button>
    <button class="quick-topic" onclick="askTopic('Compare SBI vs HDFC education loan rates')">
      ⚖️ Compare Banks
    </button>
    <button class="quick-topic" onclick="askTopic('How does the CSIS subsidy scheme work?')">
      🏛️ Govt Schemes
    </button>
    <button class="quick-topic" onclick="askTopic('What is the maximum loan I can get without collateral?')">
      💰 Collateral-Free Loans
    </button>
    <button class="quick-topic" onclick="askTopic('How long does loan approval take?')">
      ⚡ Approval Timeline
    </button>
    <button class="quick-topic" onclick="askTopic('Calculate EMI for ₹5 lakh loan at 8.15% for 10 years')">
      🧮 EMI Calculation
    </button>
    <button class="quick-topic" onclick="askTopic('What is the moratorium period in education loans?')">
      📚 Moratorium Period
    </button>
    <button class="quick-topic" onclick="askTopic('Can I get a loan for a private college?')">
      🎓 Private College Loans
    </button>

    <a href="dashboard.html" class="sidebar-back">← Back to Dashboard</a>
  </aside>

  <!-- MAIN CHAT -->
  <div class="chat-main">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="bot-avatar">🤖</div>
        <div>
          <div class="bot-name">LoanIt AI Assistant</div>
          <div class="bot-status"><div class="status-dot"></div> Online • Ready to help</div>
        </div>
      </div>
      <div style="display:flex;gap:0.5rem">
        <button class="btn btn-outline btn-sm" onclick="clearChat()">🗑️ Clear</button>
        <a href="register.html" class="btn btn-primary btn-sm">Apply Now →</a>
      </div>
    </div>

    <div class="messages-area" id="messagesArea">
      <!-- Welcome message injected by JS -->
    </div>

    <div class="chat-input-area">
      <div class="input-suggestions" id="suggestions">
        <button class="suggestion-chip" onclick="askTopic('What banks does LoanIt work with?')">Partner banks?</button>
        <button class="suggestion-chip" onclick="askTopic('Am I eligible for an education loan?')">Check eligibility</button>
        <button class="suggestion-chip" onclick="askTopic('How much loan can I get for B.Tech?')">Loan for B.Tech</button>
        <button class="suggestion-chip" onclick="askTopic('What is the interest rate for SBI education loan in 2025?')">SBI rates 2025</button>
      </div>
      <div class="input-row">
        <input
          class="chat-input"
          id="chatInput"
          placeholder="Ask anything about education loans..."
          onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage()}"
        />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
      <div class="disclaimer">AI responses are for informational purposes. Always verify with banks before applying.</div>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are LoanIt's AI Assistant — a friendly, knowledgeable expert on Indian education loans. You work for LoanIt, an online platform that helps students get education loans by connecting them with multiple banks.

LoanIt's key facts:
- Free platform for students — we earn commission from banks
- Partner banks: SBI (8.15%), Union Bank (8.05%), Bank of Baroda (8.35%), Punjab National Bank (8.45%), HDFC Bank (9.50%), Axis Bank (13.70%)
- Single application reaches all partner banks
- Average approval in 10–15 days
- Apply at: register.html

Key Indian education loan facts you know:
- Education loans up to ₹7.5L need no collateral (under IBA scheme)
- Moratorium period = course duration + 1 year (no repayment during study)
- CSIS scheme: 100% interest subsidy for families with income < ₹4.5L/year
- Padho Pardesh: subsidy for minority students going abroad
- Dr. Ambedkar scheme: OBC/EBC students studying abroad
- Tax benefit under Section 80E — full interest deduction for 8 years
- Girl students get 0.5% concession at most public sector banks
- Co-applicant (parent/guardian) is usually required

EMI formula: EMI = P × r × (1+r)^n / ((1+r)^n - 1) where r = monthly rate, n = months

Guidelines:
- Be concise, warm, and helpful
- Use bullet points and structured answers when listing info
- Always mention that LoanIt is free for students when relevant
- If asked about applying, direct to the Apply Now button or register.html
- Use ₹ for Indian rupees
- Format interest rates clearly (e.g., 8.15% p.a.)
- Keep responses focused and under 200 words unless a detailed comparison is needed
- When comparing banks, use a structured format`;

let messages = [];
let isLoading = false;

function getTime() {
  return new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

function renderMessages() {
  const area = document.getElementById('messagesArea');
  area.innerHTML = messages.map(m => {
    if (m.role === 'system') return '';
    const isUser = m.role === 'user';
    return `<div class="msg ${isUser ? 'user' : 'bot'}">
      <div class="msg-avatar">${isUser ? '👤' : '🤖'}</div>
      <div>
        <div class="msg-bubble">${formatMessage(m.content)}</div>
        <div class="msg-time">${m.time || ''}</div>
      </div>
    </div>`;
  }).join('');

  if (isLoading) {
    area.innerHTML += `<div class="msg bot">
      <div class="msg-avatar">🤖</div>
      <div>
        <div class="msg-bubble">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      </div>
    </div>`;
  }

  area.scrollTop = area.scrollHeight;
}

function formatMessage(text) {
  // Convert markdown-style formatting to HTML
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/^• (.+)$/gm, '<li>$1</li>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

async function sendMessage(text) {
  const input = document.getElementById('chatInput');
  const userText = text || input.value.trim();
  if (!userText || isLoading) return;

  input.value = '';
  messages.push({ role: 'user', content: userText, time: getTime() });
  isLoading = true;
  renderMessages();
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('suggestions').style.display = 'none';

  try {
    const apiMessages = [
      { role: 'user', content: SYSTEM_PROMPT + '\n\nYou are now answering questions. Be helpful, concise, and friendly.' },
      { role: 'assistant', content: 'Understood! I\'m ready to help with education loan questions.' },
      ...messages
        .filter(m => m.role !== 'system')
        .map(m => ({ role: m.role, content: m.content }))
    ];

    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer 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'
      },
      body: JSON.stringify({
        model: 'llama3-70b-8192',
        max_tokens: 1000,
        messages: apiMessages
      })
    });

    const data = await response.json();
    const reply = data.choices?.[0]?.message?.content || 'Sorry, I could not get a response. Please try again.';
    messages.push({ role: 'assistant', content: reply, time: getTime() });
  } catch (err) {
    messages.push({
      role: 'assistant',
      content: 'I\'m having trouble connecting right now. Please try again in a moment, or **[apply directly](register.html)** to get started with your loan.',
      time: getTime()
    });
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  renderMessages();
}

function askTopic(text) {
  sendMessage(text);
}

function clearChat() {
  messages = [];
  renderMessages();
  showWelcome();
  document.getElementById('suggestions').style.display = 'flex';
}

function showWelcome() {
  messages = [{
    role: 'assistant',
    content: `👋 Hi! I'm **LoanIt's AI Assistant**. I'm here to help you navigate the world of Indian education loans.\n\nI can help you with:\n• **Comparing bank interest rates** (SBI, HDFC, Axis, etc.)\n• **Checking eligibility** for education loans\n• **Explaining government schemes** like CSIS and Padho Pardesh\n• **Calculating EMIs** for your loan amount\n• **Documents required** and application process\n\nWhat would you like to know? 😊`,
    time: getTime()
  }];
  renderMessages();
}

showWelcome();
</script>
</body>
</html>
