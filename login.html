<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanIt – Login</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.jpg" type="image/jpeg"/>
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
  .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2.5rem; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.4); }
  .auth-logo { text-align:center; margin-bottom:1.5rem; }
  .auth-logo img { width:72px; height:72px; border-radius:18px; object-fit:cover; box-shadow:0 8px 24px rgba(26,86,219,0.25); }
  .auth-tabs { display:flex; background:var(--bg); border-radius:12px; padding:4px; margin-bottom:1.5rem; gap:4px; }
  .auth-tab { flex:1; padding:.6rem; border:none; background:transparent; color:var(--text-muted); border-radius:8px; cursor:pointer; font-weight:600; font-size:.9rem; transition:.2s; }
  .auth-tab.active { background:var(--primary); color:#fff; }
  .form-group { margin-bottom:1rem; }
  .form-group label { display:block; font-size:.85rem; color:var(--text-muted); margin-bottom:.4rem; font-weight:600; }
  .form-group input { width:100%; padding:.75rem 1rem; background:var(--bg); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-size:.95rem; box-sizing:border-box; transition:.2s; }
  .form-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(26,86,219,0.15); }
  .btn-auth { width:100%; padding:.85rem; background:var(--primary); color:#fff; border:none; border-radius:12px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:.5rem; transition:.2s; }
  .btn-auth:hover { background:#1a4fc4; transform:translateY(-1px); }
  .admin-hint { text-align:center; margin-top:1rem; padding:.75rem; background:rgba(26,86,219,0.1); border-radius:10px; font-size:.8rem; color:var(--text-muted); border:1px solid rgba(26,86,219,0.2); }
  .error-msg { color:#ef4444; font-size:.85rem; margin-top:.5rem; display:none; padding:.5rem .75rem; background:rgba(239,68,68,0.1); border-radius:8px; }
  .success-msg { color:#10b981; font-size:.85rem; margin-top:.5rem; display:none; padding:.5rem .75rem; background:rgba(16,185,129,0.1); border-radius:8px; }
  .loading { opacity:0.7; pointer-events:none; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <img src="logo.jpg" alt="LoanIt Logo"/>
  </div>
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchTab('login')">Login</button>
    <button class="auth-tab" onclick="switchTab('register')">Create Account</button>
  </div>

  <!-- Login Form -->
  <div id="loginForm">
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password"/>
    </div>
    <div class="error-msg" id="loginError"></div>
    <button class="btn-auth" onclick="doLogin()">Login</button>
    <div class="admin-hint">🔒 Admin login — contact your administrator for credentials</div>
  </div>

  <!-- Register Form -->
  <div id="registerForm" style="display:none">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="regName" placeholder="Your full name"/>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="regEmail" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPassword" placeholder="Min 6 characters"/>
    </div>
    <div class="error-msg" id="registerError"></div>
    <div class="success-msg" id="registerSuccess"></div>
    <button class="btn-auth" onclick="doRegister()">Create Account</button>
  </div>
</div>

<script type="module">
import { auth, db, createUserWithEmailAndPassword, signInWithEmailAndPassword, doc, setDoc, getDoc, serverTimestamp } from './firebase.js';

window.switchTab = function(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1)));
  document.getElementById('loginForm').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab==='register' ? 'block' : 'none';
};

window.doLogin = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  // Admin hardcoded login
  if (email === 'admin@loanit.in' && pass === 'admin123') {
    localStorage.setItem('loanit_role', 'admin');
    localStorage.setItem('loanit_user', JSON.stringify({ name: 'Admin', email, role: 'admin' }));
    window.location.href = 'admin.html';
    return;
  }

  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const userDoc = await getDoc(doc(db, 'users', cred.user.uid));
    const userData = userDoc.exists() ? userDoc.data() : { name: email, role: 'student' };
    localStorage.setItem('loanit_role', userData.role || 'student');
    localStorage.setItem('loanit_user', JSON.stringify({ ...userData, uid: cred.user.uid }));
    window.location.href = 'dashboard.html';
  } catch(e) {
    errEl.textContent = e.code === 'auth/invalid-credential' ? 'Invalid email or password.' : e.message;
    errEl.style.display = 'block';
  }
};

window.doRegister = async function() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPassword').value;
  const errEl = document.getElementById('registerError');
  const sucEl = document.getElementById('registerSuccess');
  errEl.style.display = 'none'; sucEl.style.display = 'none';

  if (!name || !email || !pass) { errEl.textContent = 'Please fill all fields.'; errEl.style.display='block'; return; }
  if (pass.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display='block'; return; }

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, 'users', cred.user.uid), { name, email, role: 'student', createdAt: serverTimestamp() });
    sucEl.textContent = '✅ Account created! Redirecting...';
    sucEl.style.display = 'block';
    localStorage.setItem('loanit_role', 'student');
    localStorage.setItem('loanit_user', JSON.stringify({ name, email, role: 'student', uid: cred.user.uid }));
    setTimeout(() => window.location.href = 'dashboard.html', 1500);
  } catch(e) {
    errEl.textContent = e.code === 'auth/email-already-in-use' ? 'Email already registered. Please login.' : e.message;
    errEl.style.display = 'block';
  }
};
</script>
</body>
</html>
