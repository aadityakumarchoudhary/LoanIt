<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanIt – Login</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.jpg" type="image/jpeg"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="logo.jpg" alt="LoanIt" style="height:64px;border-radius:16px"/>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">Create Account</button>
    </div>
    <div id="loginForm">
      <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="you@example.com"/></div>
      <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter password"/></div>
      <div class="error-msg" id="loginError" style="display:none"></div>
      <button class="btn-auth" onclick="doLogin()">Login</button>
    </div>
    <div id="registerForm" style="display:none">
      <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Your full name"/></div>
      <div class="form-group"><label>Email Address</label><input type="email" id="regEmail" placeholder="you@example.com"/></div>
      <div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="regPassword" placeholder="Create password"/></div>
      <div class="error-msg" id="registerError" style="display:none"></div>
      <div class="success-msg" id="registerSuccess" style="display:none"></div>
      <button class="btn-auth" onclick="doRegister()">Create Account</button>
    </div>
    <div class="admin-hint">🔒 Admin: admin@loanit.in / admin123</div>
  </div>
</div>
<script>
function switchTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab==='login');
  document.getElementById('tabRegister').classList.toggle('active', tab==='register');
  document.getElementById('loginForm').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab==='register' ? 'block' : 'none';
}
function doLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPassword').value;
  var err = document.getElementById('loginError');
  err.style.display = 'none';
  if (!email || !pass) { err.textContent='Please enter email and password.'; err.style.display='block'; return; }
  if (email==='admin@loanit.in' && pass==='admin123') {
    localStorage.setItem('loanit_role','admin');
    localStorage.setItem('loanit_user', JSON.stringify({name:'Admin',email:email,role:'admin'}));
    window.location.href='admin.html'; return;
  }
  var users = JSON.parse(localStorage.getItem('loanit_users')||'[]');
  var found = null;
  for (var i=0;i<users.length;i++) { if (users[i].email===email && users[i].password===pass) { found=users[i]; break; } }
  if (!found) { err.textContent='Invalid email or password. Please register first.'; err.style.display='block'; return; }
  localStorage.setItem('loanit_role','student');
  localStorage.setItem('loanit_user', JSON.stringify(found));
  window.location.href='dashboard.html';
}
function doRegister() {
  var name=document.getElementById('regName').value.trim();
  var email=document.getElementById('regEmail').value.trim();
  var pass=document.getElementById('regPassword').value;
  var err=document.getElementById('registerError');
  var suc=document.getElementById('registerSuccess');
  err.style.display='none'; suc.style.display='none';
  if (!name||!email||!pass) { err.textContent='Please fill all fields.'; err.style.display='block'; return; }
  if (pass.length<6) { err.textContent='Password must be at least 6 characters.'; err.style.display='block'; return; }
  var users=JSON.parse(localStorage.getItem('loanit_users')||'[]');
  for (var i=0;i<users.length;i++) { if (users[i].email===email) { err.textContent='Email already registered. Please login.'; err.style.display='block'; return; } }
  var user={name:name,email:email,password:pass,role:'student',uid:'USR'+Date.now(),createdAt:new Date().toISOString()};
  users.push(user);
  localStorage.setItem('loanit_users',JSON.stringify(users));
  localStorage.setItem('loanit_role','student');
  localStorage.setItem('loanit_user',JSON.stringify(user));
  suc.textContent='Account created! Redirecting...'; suc.style.display='block';
  setTimeout(function(){ window.location.href='dashboard.html'; }, 1200);
}
document.addEventListener('keydown',function(e){ if(e.key==='Enter'){ if(document.getElementById('loginForm').style.display!=='none') doLogin(); else doRegister(); } });
</script>
</body>
</html>
