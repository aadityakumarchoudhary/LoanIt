<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – LoanIt</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #e0f2fe 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 5rem 1rem 2rem; }
    .auth-container { width: 100%; max-width: 440px; }
    .auth-brand { text-align: center; margin-bottom: 2rem; }
    .auth-logo { width: 52px; height: 52px; background: linear-gradient(135deg, var(--blue), var(--cyan)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; color: white; font-family: 'JetBrains Mono', monospace; margin: 0 auto 0.75rem; box-shadow: 0 8px 24px rgba(26,86,219,0.35); }
    .auth-title { font-size: 1.5rem; font-weight: 800; color: var(--navy); }
    .auth-sub { font-size: 0.88rem; color: var(--text2); margin-top: 0.25rem; }
    .auth-card { background: white; border-radius: 20px; padding: 2rem; box-shadow: var(--shadow-xl); border: 1px solid var(--border); }
    .auth-tabs { display: flex; background: var(--surface2); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 1.75rem; }
    .auth-tab { flex: 1; padding: 0.6rem; text-align: center; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s; color: var(--text2); border: none; background: none; font-family: 'Plus Jakarta Sans', sans-serif; }
    .auth-tab.active { background: white; color: var(--blue); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .admin-hint { background: var(--blue-pale); border: 1px solid rgba(26,86,219,0.2); border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-size: 0.8rem; color: var(--blue2); margin-bottom: 1.25rem; }
    .auth-footer { text-align: center; margin-top: 1.25rem; font-size: 0.82rem; color: var(--text2); }
    .auth-footer a { color: var(--blue); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-brand">
    <div class="nav-logo">L</div>
    <span class="nav-name">Loan<span>It</span></span>
  </a>
</nav>

<div class="auth-container">
  <div class="auth-brand">
    <div class="auth-logo">L</div>
    <div class="auth-title">Welcome to LoanIt</div>
    <div class="auth-sub">Your education loan journey starts here</div>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" onclick="switchTab('register')">Create Account</button>
    </div>

    <!-- LOGIN -->
    <div class="tab-panel active" id="panel-login">
      <div class="admin-hint">🔐 Admin login: <strong>admin@loanit.in</strong> / <strong>admin123</strong></div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••"/>
      </div>
      <div id="loginError" class="alert alert-error hidden"></div>
      <button class="btn btn-primary btn-full btn-lg mt-2" onclick="doLogin()">Sign In →</button>
    </div>

    <!-- REGISTER -->
    <div class="tab-panel" id="panel-register">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" class="form-input" id="regFirst" placeholder="Rahul"/>
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-input" id="regLast" placeholder="Sharma"/>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-input" id="regEmail" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-input" id="regPhone" placeholder="9876543210"/>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="regPass" placeholder="Min 6 chars"/>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-input" id="regPass2" placeholder="Repeat"/>
        </div>
      </div>
      <div id="regError" class="alert alert-error hidden"></div>
      <div id="regSuccess" class="alert alert-success hidden"></div>
      <button class="btn btn-primary btn-full btn-lg mt-2" onclick="doRegister()">Create Account →</button>
    </div>
  </div>

  <div class="auth-footer">
    <a href="index.html">← Back to Home</a>
  </div>
</div>

<script src="app.js"></script>
<script>
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('panel-login').classList.toggle('active', tab==='login');
  document.getElementById('panel-register').classList.toggle('active', tab==='register');
}

function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPassword').value;
  const err   = document.getElementById('loginError');
  err.classList.add('hidden');
  if (!email || !pass) { err.textContent = 'Please fill all fields.'; err.classList.remove('hidden'); return; }
  const res = loginUser(email, pass);
  if (!res.ok) { err.textContent = res.msg; err.classList.remove('hidden'); return; }
  showToast('Welcome back, ' + res.user.name?.split(' ')[0] + '! 👋');
  setTimeout(() => { window.location.href = res.user.role === 'admin' ? 'admin.html' : 'dashboard.html'; }, 800);
}

function doRegister() {
  const first = document.getElementById('regFirst').value.trim();
  const last  = document.getElementById('regLast').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const pass  = document.getElementById('regPass').value;
  const pass2 = document.getElementById('regPass2').value;
  const err   = document.getElementById('regError');
  const suc   = document.getElementById('regSuccess');
  err.classList.add('hidden'); suc.classList.add('hidden');
  if (!first||!last||!email||!phone||!pass) { err.textContent='Please fill all fields.'; err.classList.remove('hidden'); return; }
  if (pass !== pass2) { err.textContent='Passwords do not match.'; err.classList.remove('hidden'); return; }
  if (pass.length < 6) { err.textContent='Password must be at least 6 characters.'; err.classList.remove('hidden'); return; }
  const res = registerUser({ name: first+' '+last, email, phone, password: pass });
  if (!res.ok) { err.textContent=res.msg; err.classList.remove('hidden'); return; }
  suc.textContent = '✅ Account created! Redirecting...';
  suc.classList.remove('hidden');
  setTimeout(() => window.location.href = 'register.html', 1200);
}
</script>
</body>
</html>
