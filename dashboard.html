<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanIt – Dashboard</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.jpg" type="image/jpeg"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <a href="index.html" class="nav-brand" style="display:flex;align-items:center;gap:0.6rem">
      <img src="logo.jpg" class="nav-logo-img" alt="LoanIt"/>
    </a>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item active"><span class="nav-icon">📊</span><span>Dashboard</span></a>
      <a href="register.html" class="nav-item"><span class="nav-icon">📝</span><span>Apply for Loan</span></a>
      <a href="compare.html" class="nav-item"><span class="nav-icon">⚖️</span><span>Compare Banks</span></a>
      <a href="upload.html" class="nav-item"><span class="nav-icon">📁</span><span>Documents</span></a>
      <a href="emi.html" class="nav-item"><span class="nav-icon">🧮</span><span>EMI Calculator</span></a>
      <a href="chatbot.html" class="nav-item"><span class="nav-icon">🤖</span><span>AI Assistant</span></a>
    </nav>
    <div class="nav-bottom">
      <button onclick="doLogout()" class="nav-item" style="width:100%;border:none;background:none;cursor:pointer;text-align:left;">
        <span class="nav-icon">🚪</span><span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">My Dashboard</h1>
        <p class="page-subtitle" id="welcomeMsg">Welcome back!</p>
      </div>
      <a href="register.html" class="btn btn-primary">+ Apply for Loan</a>
    </div>

    <!-- Stats -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card green">
        <div class="stat-icon">📋</div>
        <div class="stat-info"><div class="stat-value" id="totalApps">0</div><div class="stat-label">Total Applications</div></div>
      </div>
      <div class="stat-card blue">
        <div class="stat-icon">⏳</div>
        <div class="stat-info"><div class="stat-value" id="pendingApps">0</div><div class="stat-label">Under Review</div></div>
      </div>
      <div class="stat-card yellow">
        <div class="stat-icon">✅</div>
        <div class="stat-info"><div class="stat-value" id="approvedApps">0</div><div class="stat-label">Approved</div></div>
      </div>
      <div class="stat-card purple">
        <div class="stat-icon">💰</div>
        <div class="stat-info"><div class="stat-value" id="totalAmount">₹0</div><div class="stat-label">Total Loan Applied</div></div>
      </div>
    </div>

    <!-- Applications Table -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">My Applications</h2>
      </div>
      <div id="appsList">
        <div style="text-align:center;padding:3rem;color:var(--text-muted)">
          <div style="font-size:3rem;margin-bottom:1rem">📋</div>
          <p>Loading your applications...</p>
        </div>
      </div>
    </div>

    <!-- EMI Calculator -->
    <div class="card">
      <h2 class="card-title">EMI Calculator</h2>
      <div class="form-grid" style="grid-template-columns:repeat(3,1fr)">
        <div class="form-group"><label>Loan Amount (₹)</label><input type="number" id="emiAmt" value="500000" oninput="calcEMI()"/></div>
        <div class="form-group"><label>Interest Rate (%)</label><input type="number" id="emiRate" value="8.15" step="0.01" oninput="calcEMI()"/></div>
        <div class="form-group"><label>Tenure (Years)</label><input type="number" id="emiYears" value="10" oninput="calcEMI()"/></div>
      </div>
      <div id="emiResult" style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1rem"></div>
    </div>
  </main>
</div>

<script type="module">
import { auth, db, onAuthStateChanged, collection, query, where, getDocs } from './firebase.js';

onAuthStateChanged(auth, async user => {
  const stored = localStorage.getItem('loanit_user');
  if (!user && !stored) { window.location.href = 'login.html'; return; }
  const userData = stored ? JSON.parse(stored) : {};
  document.getElementById('welcomeMsg').textContent = 'Welcome back, ' + (userData.name || 'Student') + '!';
  await loadApplications(user?.uid || userData.uid);
});

window.doLogout = function() {
  auth.signOut?.(); localStorage.clear(); window.location.href = 'login.html';
};

async function loadApplications(uid) {
  if (!uid) { renderEmpty(); return; }
  try {
    const q = query(collection(db, 'applications'), where('userId', '==', uid));
    const snap = await getDocs(q);
    const apps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStats(apps);
    renderApps(apps);
  } catch(e) {
    document.getElementById('appsList').innerHTML = `<p style="color:#ef4444;padding:1rem">Error loading: ${e.message}</p>`;
  }
}

function renderStats(apps) {
  document.getElementById('totalApps').textContent = apps.length;
  document.getElementById('pendingApps').textContent = apps.filter(a => a.status === 'Under Review' || a.status === 'Submitted').length;
  document.getElementById('approvedApps').textContent = apps.filter(a => a.status === 'Approved').length;
  const total = apps.reduce((s,a) => s + parseFloat(a.loanAmount||0), 0);
  document.getElementById('totalAmount').textContent = '₹' + (total/100000).toFixed(1) + 'L';
}

function renderApps(apps) {
  if (!apps.length) { renderEmpty(); return; }
  const statusColor = { 'Submitted':'#f59e0b', 'Under Review':'#3b82f6', 'Approved':'#10b981', 'Rejected':'#ef4444', 'Disbursed':'#8b5cf6' };
  document.getElementById('appsList').innerHTML = `
    <table style="width:100%;border-collapse:collapse">
      <thead><tr style="border-bottom:1px solid var(--border)">
        <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">Applicant</th>
        <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">Course</th>
        <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">Bank</th>
        <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">Amount</th>
        <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">Status</th>
      </tr></thead>
      <tbody>${apps.map(a => `
        <tr style="border-bottom:1px solid var(--border)">
          <td style="padding:.75rem">${a.fullName}</td>
          <td style="padding:.75rem;color:var(--text-muted);font-size:.9rem">${a.course}</td>
          <td style="padding:.75rem;font-size:.9rem">${a.bank}</td>
          <td style="padding:.75rem;font-weight:700">₹${Number(a.loanAmount).toLocaleString('en-IN')}</td>
          <td style="padding:.75rem"><span style="background:${statusColor[a.status]||'#6b7280'}22;color:${statusColor[a.status]||'#6b7280'};padding:.25rem .75rem;border-radius:99px;font-size:.8rem;font-weight:700">${a.status}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderEmpty() {
  document.getElementById('appsList').innerHTML = `
    <div style="text-align:center;padding:3rem;color:var(--text-muted)">
      <div style="font-size:3rem;margin-bottom:1rem">📋</div>
      <p>No applications yet.</p>
      <a href="register.html" class="btn btn-primary" style="margin-top:1rem;display:inline-block">Apply Now</a>
    </div>`;
}

window.calcEMI = function() {
  const P = parseFloat(document.getElementById('emiAmt').value)||0;
  const r = (parseFloat(document.getElementById('emiRate').value)||0)/12/100;
  const n = (parseFloat(document.getElementById('emiYears').value)||0)*12;
  const emi = r ? P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1) : P/n;
  const total = emi*n;
  document.getElementById('emiResult').innerHTML = `
    <div class="stat-card blue" style="flex:1;min-width:150px"><div class="stat-info"><div class="stat-value">₹${Math.round(emi).toLocaleString('en-IN')}</div><div class="stat-label">Monthly EMI</div></div></div>
    <div class="stat-card green" style="flex:1;min-width:150px"><div class="stat-info"><div class="stat-value">₹${Math.round(total).toLocaleString('en-IN')}</div><div class="stat-label">Total Payable</div></div></div>
    <div class="stat-card yellow" style="flex:1;min-width:150px"><div class="stat-info"><div class="stat-value">₹${Math.round(total-P).toLocaleString('en-IN')}</div><div class="stat-label">Total Interest</div></div></div>`;
};

calcEMI();
</script>
</body>
</html>
