<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanIt – Upload Documents</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.jpg" type="image/jpeg"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <a href="index.html" class="nav-brand" style="display:flex;align-items:center;gap:0.6rem">
      <img src="logo.jpg" class="nav-logo-img" alt="LoanIt"/>
    </a>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
      <a href="register.html" class="nav-item"><span class="nav-icon">📝</span><span>Apply for Loan</span></a>
      <a href="compare.html" class="nav-item"><span class="nav-icon">⚖️</span><span>Compare Banks</span></a>
      <a href="upload.html" class="nav-item active"><span class="nav-icon">📁</span><span>Documents</span></a>
      <a href="emi.html" class="nav-item"><span class="nav-icon">🧮</span><span>EMI Calculator</span></a>
      <a href="chatbot.html" class="nav-item"><span class="nav-icon">🤖</span><span>AI Assistant</span></a>
    </nav>
    <div class="nav-bottom">
      <button onclick="doLogout()" class="nav-item" style="width:100%;border:none;background:none;cursor:pointer;text-align:left;">
        <span class="nav-icon">🚪</span><span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Upload Documents</h1>
        <p class="page-subtitle">Upload all required documents for your loan application</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem;padding:1.25rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">
        <span style="font-weight:700;color:#0f172a">Upload Progress</span>
        <span id="docProgressLabel" style="font-size:.85rem;color:#64748b">0 of 7 documents</span>
      </div>
      <div style="height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden">
        <div id="docProgress" style="height:100%;background:linear-gradient(90deg,#1a56db,#0ea5e9);border-radius:99px;transition:width .4s;width:0%"></div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title" style="margin-bottom:1.5rem">Required Documents</h2>
      <div id="docsList"></div>
    </div>
  </main>
</div>

<script>
var currentUser = JSON.parse(localStorage.getItem('loanit_user') || 'null');
if (!currentUser) window.location.href = 'login.html';

function doLogout() { localStorage.removeItem('loanit_user'); localStorage.removeItem('loanit_role'); window.location.href = 'login.html'; }

var DOCS = [
  { id:'aadhaar',   label:'Aadhaar Card',                    required:true  },
  { id:'pan',       label:'PAN Card',                         required:true  },
  { id:'marksheet', label:'10th & 12th Marksheets',           required:true  },
  { id:'admission', label:'College Admission Letter',          required:true  },
  { id:'income',    label:'Income Certificate (Co-applicant)', required:true  },
  { id:'photo',     label:'Passport Size Photo',               required:false },
  { id:'bank',      label:'Bank Statement (6 months)',         required:false },
];

var uploaded = JSON.parse(localStorage.getItem('loanit_docs_' + currentUser.uid) || '{}');

function renderDocs() {
  var html = '';
  for (var i = 0; i < DOCS.length; i++) {
    var d = DOCS[i];
    var done = !!uploaded[d.id];
    var borderColor = done ? '#10b981' : '#e2e8f0';
    var bg = done ? 'rgba(16,185,129,0.07)' : 'white';
    var statusHtml = done
      ? '<div style="font-size:.78rem;color:#10b981;font-weight:600">✅ Uploaded: ' + uploaded[d.id].name + '</div>'
      : '<div style="font-size:.78rem;color:#94a3b8">Not uploaded yet</div>';
    var btnColor = done ? '#10b981' : '#1a56db';
    var btnLabel = done ? 'Replace' : 'Upload';
    html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border:1.5px solid ' + borderColor + ';border-radius:12px;margin-bottom:.75rem;background:' + bg + ';transition:.2s">' +
      '<div style="display:flex;align-items:center;gap:.85rem">' +
      '<span style="font-size:1.5rem">' + (done ? '✅' : '📄') + '</span>' +
      '<div><div style="font-weight:600;font-size:.92rem">' + d.label + (d.required ? ' <span style="color:#ef4444;font-size:.72rem">Required</span>' : ' <span style="color:#94a3b8;font-size:.72rem">Optional</span>') + '</div>' + statusHtml + '</div></div>' +
      '<label style="cursor:pointer;padding:.45rem .9rem;border-radius:8px;font-size:.82rem;font-weight:600;background:' + btnColor + ';color:white;white-space:nowrap">' + btnLabel + '<input type="file" id="file_' + d.id + '" style="display:none" onchange="handleUpload(\'' + d.id + '\',this)"/></label>' +
      '</div>';
  }
  document.getElementById('docsList').innerHTML = html;
  updateProgress();
}

function handleUpload(id, input) {
  if (!input.files || !input.files[0]) return;
  uploaded[id] = { name: input.files[0].name, size: input.files[0].size, uploadedAt: new Date().toISOString() };
  localStorage.setItem('loanit_docs_' + currentUser.uid, JSON.stringify(uploaded));
  renderDocs();
}

function updateProgress() {
  var done = 0;
  for (var i = 0; i < DOCS.length; i++) { if (uploaded[DOCS[i].id]) done++; }
  var pct = Math.round(done / DOCS.length * 100);
  document.getElementById('docProgress').style.width = pct + '%';
  document.getElementById('docProgressLabel').textContent = done + ' of ' + DOCS.length + ' documents uploaded (' + pct + '%)';
}

renderDocs();
</script>
</body>
</html>
