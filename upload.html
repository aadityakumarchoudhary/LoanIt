<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanIt – Documents</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.jpg" type="image/jpeg"/>
<style>
.doc-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; }
.doc-card { background:var(--surface); border:2px dashed var(--border); border-radius:14px; padding:1.5rem; text-align:center; cursor:pointer; transition:.2s; }
.doc-card:hover { border-color:var(--primary); background:rgba(26,86,219,0.05); }
.doc-card.uploaded { border-style:solid; border-color:#10b981; background:rgba(16,185,129,0.05); }
.doc-icon { font-size:2rem; margin-bottom:.5rem; }
.doc-name { font-weight:600; font-size:.9rem; margin-bottom:.25rem; }
.doc-status { font-size:.78rem; color:var(--text-muted); }
.doc-card.uploaded .doc-status { color:#10b981; }
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <a href="index.html" class="nav-brand" style="display:flex;align-items:center;gap:0.6rem">
      <img src="logo.jpg" class="nav-logo-img" alt="LoanIt"/>
    </a>
    <nav class="nav-links">
      <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span><span>Dashboard</span></a>
      <a href="register.html" class="nav-item"><span class="nav-icon">📝</span><span>Apply for Loan</span></a>
      <a href="compare.html" class="nav-item"><span class="nav-icon">⚖️</span><span>Compare Banks</span></a>
      <a href="upload.html" class="nav-item active"><span class="nav-icon">📁</span><span>Documents</span></a>
    </nav>
    <div class="nav-bottom">
      <button onclick="doLogout()" class="nav-item" style="width:100%;border:none;background:none;cursor:pointer;text-align:left;">
        <span class="nav-icon">🚪</span><span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Document Upload</h1>
        <p class="page-subtitle">Upload required documents for your loan application</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem;padding:1rem 1.5rem;background:rgba(26,86,219,0.08);border:1px solid rgba(26,86,219,0.2)">
      <p style="color:var(--primary);font-size:.9rem">📌 <strong>Note:</strong> Documents are saved as metadata in Firebase. In a production app, files would be stored in Firebase Storage.</p>
    </div>

    <div class="card">
      <h2 class="card-title">Required Documents</h2>
      <div class="doc-grid" id="docGrid"></div>
    </div>

    <div class="card" id="uploadedSection" style="display:none">
      <h2 class="card-title">Uploaded Documents</h2>
      <div id="uploadedList"></div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" style="display:none" onchange="handleFile(event)"/>

<script type="module">
import { auth, db, onAuthStateChanged, collection, addDoc, getDocs, query, where, serverTimestamp } from './firebase.js';

onAuthStateChanged(auth, user => {
  if (!user && !localStorage.getItem('loanit_user')) window.location.href = 'login.html';
  loadUploaded();
});

window.doLogout = function() { auth.signOut?.(); localStorage.clear(); window.location.href = 'login.html'; };

const DOCS = [
  { id:'aadhaar', name:'Aadhaar Card', icon:'🪪', desc:'Front & Back' },
  { id:'pan', name:'PAN Card', icon:'💳', desc:'Clear photo' },
  { id:'marksheet', name:'12th Marksheet', icon:'📜', desc:'Official marksheet' },
  { id:'admission', name:'Admission Letter', icon:'🎓', desc:'From college' },
  { id:'fee_structure', name:'Fee Structure', icon:'💰', desc:'College fee details' },
  { id:'income_proof', name:'Income Proof', icon:'📄', desc:'Co-applicant salary slip' },
  { id:'bank_statement', name:'Bank Statement', icon:'🏦', desc:'Last 6 months' },
  { id:'photo', name:'Passport Photo', icon:'📸', desc:'Recent photo' },
];

let uploadedDocs = [];
let currentDocId = null;

function renderDocGrid() {
  document.getElementById('docGrid').innerHTML = DOCS.map(d => {
    const isUploaded = uploadedDocs.some(u => u.docId === d.id);
    return `<div class="doc-card ${isUploaded?'uploaded':''}" onclick="triggerUpload('${d.id}')">
      <div class="doc-icon">${d.icon}</div>
      <div class="doc-name">${d.name}</div>
      <div class="doc-status">${isUploaded ? '✅ Uploaded' : d.desc}</div>
      ${isUploaded ? '' : '<div style="margin-top:.75rem;font-size:.8rem;color:var(--primary)">Click to upload</div>'}
    </div>`;
  }).join('');
}

window.triggerUpload = function(docId) {
  currentDocId = docId;
  document.getElementById('fileInput').click();
};

window.handleFile = async function(e) {
  const file = e.target.files[0];
  if (!file || !currentDocId) return;
  const userStr = localStorage.getItem('loanit_user');
  const user = userStr ? JSON.parse(userStr) : {};
  const docMeta = DOCS.find(d => d.id === currentDocId);
  try {
    await addDoc(collection(db, 'documents'), {
      docId: currentDocId,
      docName: docMeta.name,
      fileName: file.name,
      fileSize: file.size,
      fileType: file.type,
      userId: user.uid || 'guest',
      uploadedAt: serverTimestamp(),
    });
    await loadUploaded();
  } catch(err) {
    alert('Error saving document info: ' + err.message);
  }
  e.target.value = '';
};

async function loadUploaded() {
  const userStr = localStorage.getItem('loanit_user');
  const user = userStr ? JSON.parse(userStr) : {};
  try {
    const q = query(collection(db, 'documents'), where('userId','==', user.uid||'guest'));
    const snap = await getDocs(q);
    uploadedDocs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderDocGrid();
    if (uploadedDocs.length) {
      document.getElementById('uploadedSection').style.display = 'block';
      document.getElementById('uploadedList').innerHTML = `
        <table style="width:100%;border-collapse:collapse">
          <thead><tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">Document</th>
            <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">File</th>
            <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">Size</th>
            <th style="text-align:left;padding:.75rem;color:var(--text-muted);font-size:.85rem">Status</th>
          </tr></thead>
          <tbody>${uploadedDocs.map(d=>`<tr style="border-bottom:1px solid var(--border)">
            <td style="padding:.75rem;font-weight:600">${d.docName}</td>
            <td style="padding:.75rem;color:var(--text-muted);font-size:.9rem">${d.fileName}</td>
            <td style="padding:.75rem;font-size:.9rem">${(d.fileSize/1024).toFixed(1)} KB</td>
            <td style="padding:.75rem"><span style="background:rgba(16,185,129,0.15);color:#10b981;padding:.2rem .6rem;border-radius:99px;font-size:.8rem;font-weight:700">✅ Saved</span></td>
          </tr>`).join('')}</tbody>
        </table>`;
    }
  } catch(e) { console.error(e); }
}
</script>
</body>
</html>
