<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanIt – Admin Panel</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.jpg" type="image/jpeg"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <a href="index.html" class="nav-brand" style="display:flex;align-items:center;gap:0.6rem">
      <img src="logo.jpg" class="nav-logo-img" alt="LoanIt"/>
      <span style="font-size:.75rem;background:rgba(255,255,255,0.15);padding:2px 10px;border-radius:99px;color:rgba(255,255,255,0.85);font-weight:700">ADMIN</span>
    </a>
    <nav class="nav-links">
      <a href="admin.html" class="nav-item active"><span class="nav-icon">🛡️</span><span>All Applications</span></a>
      <a href="#" class="nav-item" onclick="loadUsers()"><span class="nav-icon">👥</span><span>Users</span></a>
    </nav>
    <div class="nav-bottom">
      <button onclick="doLogout()" class="nav-item" style="width:100%;border:none;background:none;cursor:pointer;text-align:left;">
        <span class="nav-icon">🚪</span><span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Admin Panel</h1>
        <p class="page-subtitle">Manage all loan applications</p>
      </div>
      <button class="btn btn-primary" onclick="loadApplications()">🔄 Refresh</button>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card blue"><div class="stat-icon">📋</div><div class="stat-info"><div class="stat-value" id="aTotal">0</div><div class="stat-label">Total Applications</div></div></div>
      <div class="stat-card yellow"><div class="stat-icon">⏳</div><div class="stat-info"><div class="stat-value" id="aPending">0</div><div class="stat-label">Pending Review</div></div></div>
      <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-info"><div class="stat-value" id="aApproved">0</div><div class="stat-label">Approved</div></div></div>
      <div class="stat-card purple"><div class="stat-icon">💰</div><div class="stat-info"><div class="stat-value" id="aAmount">₹0</div><div class="stat-label">Total Loan Value</div></div></div>
    </div>

    <!-- Filter Bar -->
    <div class="card" style="padding:1rem 1.5rem">
      <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
        <input type="text" id="searchInput" placeholder="Search by name or college..." oninput="filterApps()" style="flex:1;min-width:200px;padding:.6rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text)"/>
        <select id="statusFilter" onchange="filterApps()" style="padding:.6rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text)">
          <option value="">All Status</option>
          <option>Submitted</option>
          <option>Under Review</option>
          <option>Approved</option>
          <option>Rejected</option>
          <option>Disbursed</option>
        </select>
        <select id="bankFilter" onchange="filterApps()" style="padding:.6rem 1rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text)">
          <option value="">All Banks</option>
          <option>State Bank of India</option>
          <option>HDFC Bank</option>
          <option>Axis Bank</option>
          <option>Bank of Baroda</option>
          <option>Union Bank</option>
          <option>Punjab National Bank</option>
        </select>
      </div>
    </div>

    <!-- Applications Table -->
    <div class="card">
      <div id="adminAppsList">
        <div style="text-align:center;padding:3rem;color:var(--text-muted)">
          <div style="font-size:2rem;margin-bottom:1rem">⏳</div>
          <p>Loading applications from Firebase...</p>
        </div>
      </div>
    </div>

    <!-- Users Section (hidden by default) -->
    <div class="card" id="usersSection" style="display:none">
      <h2 class="card-title">Registered Users</h2>
      <div id="usersList"></div>
    </div>
  </main>
</div>

<!-- Status Update Modal -->
<div id="statusModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:none;align-items:center;justify-content:center">
  <div class="card" style="width:90%;max-width:400px;padding:2rem">
    <h3 id="modalName" style="margin-bottom:1rem"></h3>
    <div class="form-group">
      <label>Update Status</label>
      <select id="newStatus" style="width:100%;padding:.75rem;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text)">
        <option>Submitted</option>
        <option>Under Review</option>
        <option>Approved</option>
        <option>Rejected</option>
        <option>Disbursed</option>
      </select>
    </div>
    <div style="display:flex;gap:1rem;margin-top:1rem">
      <button class="btn btn-outline" onclick="closeModal()" style="flex:1">Cancel</button>
      <button class="btn btn-primary" onclick="saveStatus()" style="flex:1">Save</button>
    </div>
  </div>
</div>

<script>
const role = localStorage.getItem('loanit_role');
if (role !== 'admin') window.location.href = 'login.html';

window.doLogout = function() { localStorage.removeItem('loanit_user'); localStorage.removeItem('loanit_role'); window.location.href = 'login.html'; };

let allApps = [];
let editId = null;

window.loadApplications = function() {
  allApps = JSON.parse(localStorage.getItem('loanit_applications') || '[]');
  renderStats(allApps);
  renderTable(allApps);
};

function renderStats(apps) {
  document.getElementById('aTotal').textContent = apps.length;
  document.getElementById('aPending').textContent = apps.filter(a => ['Submitted','Under Review'].includes(a.status)).length;
  document.getElementById('aApproved').textContent = apps.filter(a => a.status === 'Approved').length;
  const total = apps.reduce((s,a) => s + parseFloat(a.loanAmount||0), 0);
  document.getElementById('aAmount').textContent = '₹' + (total/100000).toFixed(1) + 'L';
}

function renderTable(apps) {
  if (!apps.length) {
    document.getElementById('adminAppsList').innerHTML = '<div style="text-align:center;padding:3rem;color:var(--text-muted)"><div style="font-size:3rem">📭</div><p>No applications found.</p></div>';
    return;
  }
  const statusColor = { 'Submitted':'#f59e0b','Under Review':'#3b82f6','Approved':'#10b981','Rejected':'#ef4444','Disbursed':'#8b5cf6' };
  document.getElementById('adminAppsList').innerHTML = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:700px"><thead><tr style="border-bottom:1px solid var(--border)"><th style="text-align:left;padding:.75rem .5rem;color:var(--text-muted);font-size:.8rem">Applicant</th><th style="text-align:left;padding:.75rem .5rem;color:var(--text-muted);font-size:.8rem">Course</th><th style="text-align:left;padding:.75rem .5rem;color:var(--text-muted);font-size:.8rem">Bank</th><th style="text-align:left;padding:.75rem .5rem;color:var(--text-muted);font-size:.8rem">Amount</th><th style="text-align:left;padding:.75rem .5rem;color:var(--text-muted);font-size:.8rem">Status</th><th style="text-align:left;padding:.75rem .5rem;color:var(--text-muted);font-size:.8rem">Action</th></tr></thead><tbody>' +
    apps.map(a => '<tr style="border-bottom:1px solid var(--border)"><td style="padding:.75rem .5rem">' + a.fullName + '</td><td style="padding:.75rem .5rem;font-size:.85rem;color:var(--text-muted)">' + a.course + '</td><td style="padding:.75rem .5rem;font-size:.85rem">' + a.bank + '</td><td style="padding:.75rem .5rem;font-weight:700">₹' + Number(a.loanAmount).toLocaleString("en-IN") + '</td><td style="padding:.75rem .5rem"><span style="background:' + (statusColor[a.status]||"#6b7280") + '22;color:' + (statusColor[a.status]||"#6b7280") + ';padding:.2rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700">' + a.status + '</span></td><td style="padding:.75rem .5rem"><button onclick="openModal('' + a.id + '','' + a.fullName + '')" class="btn btn-outline btn-sm">Update</button></td></tr>').join('') +
    '</tbody></table></div>';
}

window.filterApps = function() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const bank = document.getElementById('bankFilter').value;
  const filtered = allApps.filter(a =>
    (!search || a.fullName?.toLowerCase().includes(search) || a.college?.toLowerCase().includes(search)) &&
    (!status || a.status === status) &&
    (!bank || a.bank === bank)
  );
  renderTable(filtered);
};

window.openModal = function(id, name) {
  editId = id;
  document.getElementById('modalName').textContent = 'Update: ' + name;
  document.getElementById('statusModal').style.display = 'flex';
};

window.closeModal = function() { document.getElementById('statusModal').style.display = 'none'; };

window.saveStatus = function() {
  const newStatus = document.getElementById('newStatus').value;
  const apps = JSON.parse(localStorage.getItem('loanit_applications') || '[]');
  const idx = apps.findIndex(a => a.id === editId);
  if (idx >= 0) { apps[idx].status = newStatus; localStorage.setItem('loanit_applications', JSON.stringify(apps)); }
  closeModal();
  loadApplications();
};

window.loadUsers = function() {
  const users = JSON.parse(localStorage.getItem('loanit_users') || '[]');
  document.getElementById('usersSection').style.display = 'block';
  document.getElementById('usersList').innerHTML = users.length ?
    '<table style="width:100%;border-collapse:collapse">' +
    '<thead><tr><th style="text-align:left;padding:.6rem;color:var(--text-muted);font-size:.8rem">Name</th><th style="text-align:left;padding:.6rem;color:var(--text-muted);font-size:.8rem">Email</th><th style="text-align:left;padding:.6rem;color:var(--text-muted);font-size:.8rem">Joined</th></tr></thead><tbody>' +
    users.map(u => '<tr style="border-bottom:1px solid var(--border)"><td style="padding:.6rem">' + u.name + '</td><td style="padding:.6rem;color:var(--text-muted)">' + u.email + '</td><td style="padding:.6rem;color:var(--text-muted);font-size:.82rem">' + new Date(u.createdAt).toLocaleDateString('en-IN') + '</td></tr>').join('') +
    '</tbody></table>' :
    '<p style="color:var(--text-muted);padding:1rem">No registered users yet.</p>';
};

loadApplications();
</script>
</body>
</html>
