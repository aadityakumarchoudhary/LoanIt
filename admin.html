<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LoanIt – Admin Panel</title>
<link rel="stylesheet" href="style.css"/>
<link rel="icon" href="logo.jpg" type="image/jpeg"/>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <a href="index.html" class="nav-brand" style="display:flex;align-items:center;gap:0.6rem">
      <img src="logo.jpg" class="nav-logo-img" alt="LoanIt"/>
    </a>
    <nav class="nav-links">
      <a href="admin.html" class="nav-item active"><span class="nav-icon">🛡️</span><span>Admin Panel</span></a>
      <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
    </nav>
    <div class="nav-bottom">
      <button onclick="doLogout()" class="nav-item" style="width:100%;border:none;background:none;cursor:pointer;text-align:left;">
        <span class="nav-icon">🚪</span><span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Admin Dashboard</h1>
        <p class="page-subtitle">Manage all loan applications</p>
      </div>
    </div>

    <div class="stats-grid" style="margin-bottom:2rem">
      <div class="stat-card blue"><div class="stat-info"><div class="stat-num" id="aTotal">0</div><div class="stat-label">Total Applications</div></div></div>
      <div class="stat-card yellow"><div class="stat-info"><div class="stat-num" id="aPending">0</div><div class="stat-label">Pending</div></div></div>
      <div class="stat-card green"><div class="stat-info"><div class="stat-num" id="aApproved">0</div><div class="stat-label">Approved</div></div></div>
      <div class="stat-card purple"><div class="stat-info"><div class="stat-num" id="aAmount">₹0</div><div class="stat-label">Total Amount</div></div></div>
    </div>

    <!-- Filters -->
    <div class="card" style="margin-bottom:1.5rem;padding:1rem">
      <div style="display:flex;gap:1rem;flex-wrap:wrap;align-items:center">
        <input type="text" id="searchInput" placeholder="Search by name or college..." style="flex:1;min-width:200px;padding:.6rem .9rem;border:1.5px solid #e2e8f0;border-radius:10px;font-family:inherit" oninput="filterApps()"/>
        <select id="statusFilter" onchange="filterApps()" style="padding:.6rem .9rem;border:1.5px solid #e2e8f0;border-radius:10px;font-family:inherit">
          <option value="">All Status</option>
          <option>Submitted</option><option>Under Review</option><option>Approved</option><option>Rejected</option><option>Disbursed</option>
        </select>
        <select id="bankFilter" onchange="filterApps()" style="padding:.6rem .9rem;border:1.5px solid #e2e8f0;border-radius:10px;font-family:inherit">
          <option value="">All Banks</option>
          <option>State Bank of India</option><option>Union Bank</option><option>Bank of Baroda</option><option>Punjab National Bank</option><option>HDFC Bank</option><option>Axis Bank</option>
        </select>
      </div>
    </div>

    <div class="card" style="margin-bottom:1.5rem">
      <div class="card-header"><h2 class="card-title">All Applications</h2></div>
      <div id="adminAppsList"></div>
    </div>

    <div class="card">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
        <h2 class="card-title">Registered Users</h2>
        <button class="btn btn-outline btn-sm" onclick="loadUsers()">Refresh</button>
      </div>
      <div id="usersList"></div>
    </div>
  </main>
</div>

<!-- Status Modal -->
<div id="statusModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center">
  <div style="background:white;border-radius:16px;padding:2rem;min-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <h3 id="modalName" style="margin-bottom:1.5rem;color:#0f172a"></h3>
    <div class="form-group">
      <label>New Status</label>
      <select id="newStatus" style="width:100%;padding:.7rem;border:1.5px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:1rem">
        <option>Submitted</option>
        <option>Under Review</option>
        <option>Approved</option>
        <option>Rejected</option>
        <option>Disbursed</option>
      </select>
    </div>
    <div style="display:flex;gap:1rem;margin-top:1.5rem">
      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveStatus()">Save</button>
    </div>
  </div>
</div>

<script>
if (localStorage.getItem('loanit_role') !== 'admin') window.location.href = 'login.html';

function doLogout() { localStorage.removeItem('loanit_user'); localStorage.removeItem('loanit_role'); window.location.href = 'login.html'; }

var allApps = [];
var editId = null;

function loadApps() {
  allApps = JSON.parse(localStorage.getItem('loanit_applications') || '[]');
  var pending = 0, approved = 0, total = 0;
  for (var i = 0; i < allApps.length; i++) {
    if (allApps[i].status === 'Submitted' || allApps[i].status === 'Under Review') pending++;
    if (allApps[i].status === 'Approved' || allApps[i].status === 'Disbursed') approved++;
    total += parseFloat(allApps[i].loanAmount || 0);
  }
  document.getElementById('aTotal').textContent = allApps.length;
  document.getElementById('aPending').textContent = pending;
  document.getElementById('aApproved').textContent = approved;
  document.getElementById('aAmount').textContent = '₹' + (total / 100000).toFixed(1) + 'L';
  renderTable(allApps);
  loadUsers();
}

function renderTable(apps) {
  if (!apps.length) {
    document.getElementById('adminAppsList').innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8"><div style="font-size:3rem">📭</div><p>No applications found.</p></div>';
    return;
  }
  var colors = { 'Submitted':'#f59e0b','Under Review':'#3b82f6','Approved':'#10b981','Rejected':'#ef4444','Disbursed':'#8b5cf6' };
  var html = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:700px"><thead><tr style="border-bottom:1px solid #e2e8f0">' +
    '<th style="text-align:left;padding:.7rem;color:#94a3b8;font-size:.8rem">Applicant</th>' +
    '<th style="text-align:left;padding:.7rem;color:#94a3b8;font-size:.8rem">Course</th>' +
    '<th style="text-align:left;padding:.7rem;color:#94a3b8;font-size:.8rem">Bank</th>' +
    '<th style="text-align:left;padding:.7rem;color:#94a3b8;font-size:.8rem">Amount</th>' +
    '<th style="text-align:left;padding:.7rem;color:#94a3b8;font-size:.8rem">Status</th>' +
    '<th style="text-align:left;padding:.7rem;color:#94a3b8;font-size:.8rem">Action</th>' +
    '</tr></thead><tbody>';
  for (var i = 0; i < apps.length; i++) {
    var a = apps[i];
    var c = colors[a.status] || '#6b7280';
    html += '<tr style="border-bottom:1px solid #f1f5f9">' +
      '<td style="padding:.7rem;font-weight:600">' + a.fullName + '</td>' +
      '<td style="padding:.7rem;color:#64748b;font-size:.85rem">' + a.course + '</td>' +
      '<td style="padding:.7rem;font-size:.85rem">' + a.bank + '</td>' +
      '<td style="padding:.7rem;font-weight:700">₹' + Number(a.loanAmount).toLocaleString('en-IN') + '</td>' +
      '<td style="padding:.7rem"><span style="background:' + c + '22;color:' + c + ';padding:.2rem .65rem;border-radius:99px;font-size:.78rem;font-weight:700">' + a.status + '</span></td>' +
      '<td style="padding:.7rem"><button onclick="openModal(\'' + a.id + '\',\'' + a.fullName.replace(/'/g,"") + '\')" class="btn btn-outline btn-sm">Update</button></td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';
  document.getElementById('adminAppsList').innerHTML = html;
}

function filterApps() {
  var search = document.getElementById('searchInput').value.toLowerCase();
  var status = document.getElementById('statusFilter').value;
  var bank = document.getElementById('bankFilter').value;
  var filtered = [];
  for (var i = 0; i < allApps.length; i++) {
    var a = allApps[i];
    var matchSearch = !search || (a.fullName||'').toLowerCase().includes(search) || (a.college||'').toLowerCase().includes(search);
    var matchStatus = !status || a.status === status;
    var matchBank = !bank || a.bank === bank;
    if (matchSearch && matchStatus && matchBank) filtered.push(a);
  }
  renderTable(filtered);
}

function openModal(id, name) {
  editId = id;
  document.getElementById('modalName').textContent = 'Update Status: ' + name;
  document.getElementById('statusModal').style.display = 'flex';
}

function closeModal() { document.getElementById('statusModal').style.display = 'none'; }

function saveStatus() {
  var newStatus = document.getElementById('newStatus').value;
  var apps = JSON.parse(localStorage.getItem('loanit_applications') || '[]');
  for (var i = 0; i < apps.length; i++) {
    if (apps[i].id === editId) { apps[i].status = newStatus; break; }
  }
  localStorage.setItem('loanit_applications', JSON.stringify(apps));
  closeModal();
  loadApps();
}

function loadUsers() {
  var users = JSON.parse(localStorage.getItem('loanit_users') || '[]');
  if (!users.length) {
    document.getElementById('usersList').innerHTML = '<p style="color:#94a3b8;padding:1rem">No registered users yet.</p>';
    return;
  }
  var html = '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr style="border-bottom:1px solid #e2e8f0">' +
    '<th style="text-align:left;padding:.6rem;color:#94a3b8;font-size:.8rem">Name</th>' +
    '<th style="text-align:left;padding:.6rem;color:#94a3b8;font-size:.8rem">Email</th>' +
    '<th style="text-align:left;padding:.6rem;color:#94a3b8;font-size:.8rem">Joined</th>' +
    '</tr></thead><tbody>';
  for (var i = 0; i < users.length; i++) {
    var u = users[i];
    html += '<tr style="border-bottom:1px solid #f1f5f9">' +
      '<td style="padding:.6rem;font-weight:600">' + u.name + '</td>' +
      '<td style="padding:.6rem;color:#64748b">' + u.email + '</td>' +
      '<td style="padding:.6rem;color:#94a3b8;font-size:.82rem">' + new Date(u.createdAt).toLocaleDateString('en-IN') + '</td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';
  document.getElementById('usersList').innerHTML = html;
}

loadApps();
</script>
</body>
</html>
